spring.application.name=frutimarket-bd
server.port=${PORT:8080}

# Credenciales en app/.env (no se sube a git). Ver .env.example
spring.config.import=optional:file:.env[.properties],optional:file:app/.env[.properties]

spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:frutimarket_bd}
spring.datasource.username=${DB_USER:frutimarket_app}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never

spring.thymeleaf.cache=false
server.servlet.session.timeout=60m
server.error.whitelabel.enabled=false
spring.web.locale=es_CO
