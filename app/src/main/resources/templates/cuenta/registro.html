<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><th:block th:replace="~{fragments/cabeza :: cabeza('Crear cuenta · FrutiMarket')}"></th:block></head>
<body>
<div class="container py-5" style="max-width:860px">
  <a href="/login" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Volver al inicio de sesión</a>
  <h1 class="h3 mt-3 mb-1">Crear cuenta de cliente</h1>
  <p class="text-secondary">Regístrese para hacer pedidos, suscribirse a una canasta y recibir recordatorios.</p>
  <div class="alerta alerta-error" th:if="${error}"><i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}"></span></div>
  <form class="tarjeta" method="post" th:action="@{/registro}" novalidate th:with="e=${errores ?: {:}}">
    <div class="tarjeta-cab"><h2>Datos del cliente</h2></div>
    <div class="tarjeta-cuerpo row g-3">
      <div class="col-md-8"><label class="form-label">Nombre completo o razón social *</label>
        <input class="form-control" name="nombre" th:value="${v['nombre']}" th:classappend="${e['nombre']} ? 'is-invalid'" maxlength="120">
        <div class="invalid-feedback" th:text="${e['nombre']}"></div></div>
      <div class="col-md-4"><label class="form-label">Tipo de cliente *</label>
        <select class="form-select" name="tipo_cliente">
          <option th:each="t : ${ {'HOGAR','RESTAURANTE','HOTEL','TIENDA','SUPERMERCADO'} }" th:value="${t}" th:text="${fmt.etiqueta(t)}" th:selected="${v['tipo_cliente'] == t}"></option>
        </select></div>
      <div class="col-md-3"><label class="form-label">Tipo de documento *</label>
        <select class="form-select" name="tipo_documento">
          <option value="CC" th:selected="${v['tipo_documento'] == 'CC'}">Cédula (CC)</option>
          <option value="CE" th:selected="${v['tipo_documento'] == 'CE'}">Cédula de extranjería</option>
          <option value="NIT" th:selected="${v['tipo_documento'] == 'NIT'}">NIT (empresa)</option>
        </select></div>
      <div class="col-md-4"><label class="form-label">Número de documento *</label>
        <input class="form-control" name="numero_documento" th:value="${v['numero_documento']}" th:classappend="${e['numero_documento']} ? 'is-invalid'" maxlength="20">
        <div class="invalid-feedback" th:text="${e['numero_documento']}"></div></div>
      <div class="col-md-5"><label class="form-label">Teléfono *</label>
        <input class="form-control" name="telefono" type="tel" th:value="${v['telefono']}" th:classappend="${e['telefono']} ? 'is-invalid'" placeholder="3101234567">
        <div class="invalid-feedback" th:text="${e['telefono']}"></div></div>
      <div class="col-md-8"><label class="form-label">Dirección de entrega *</label>
        <input class="form-control" name="direccion" th:value="${v['direccion']}" th:classappend="${e['direccion']} ? 'is-invalid'" maxlength="150" placeholder="Carrera 14 # 20-35, barrio Centro">
        <div class="invalid-feedback" th:text="${e['direccion']}"></div></div>
      <div class="col-md-4"><label class="form-label">Municipio *</label>
        <select class="form-select" name="id_municipio">
          <option th:each="m : ${municipios}" th:value="${m.id_municipio}" th:text="${m.nombre} + ' (' + ${m.departamento} + ')'"
                  th:selected="${v['id_municipio'] == m.id_municipio.toString()}"></option>
        </select></div>
    </div>
    <div class="tarjeta-cab" style="border-top:1px solid var(--fm-borde)"><h2>Datos de acceso</h2></div>
    <div class="tarjeta-cuerpo row g-3">
      <div class="col-md-6"><label class="form-label">Correo electrónico *</label>
        <input class="form-control" name="email" type="email" th:value="${v['email']}" th:classappend="${e['email']} ? 'is-invalid'">
        <div class="invalid-feedback" th:text="${e['email']}"></div></div>
      <div class="col-md-6"><label class="form-label">Usuario *</label>
        <input class="form-control" name="username" th:value="${v['username']}" th:classappend="${e['username']} ? 'is-invalid'" placeholder="laura.gomez">
        <div class="invalid-feedback" th:text="${e['username']}"></div></div>
      <div class="col-md-6"><label class="form-label">Contraseña *</label>
        <input class="form-control" name="clave" type="password" th:classappend="${e['clave']} ? 'is-invalid'" autocomplete="new-password">
        <div class="invalid-feedback" th:text="${e['clave']}"></div><div class="form-text" th:unless="${e['clave']}">Mínimo 8 caracteres, con letras y números.</div></div>
      <div class="col-md-6"><label class="form-label">Confirmar contraseña *</label>
        <input class="form-control" name="clave2" type="password" th:classappend="${e['clave2']} ? 'is-invalid'" autocomplete="new-password">
        <div class="invalid-feedback" th:text="${e['clave2']}"></div></div>
    </div>
    <div class="tarjeta-cab" style="border-top:1px solid var(--fm-borde);border-bottom:0;justify-content:flex-end">
      <button class="btn btn-primary btn-lg">Crear mi cuenta</button>
    </div>
  </form>
</div>
</body>
</html>
