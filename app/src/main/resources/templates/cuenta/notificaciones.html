<!DOCTYPE html>
<html th:replace="~{fragments/layout :: pagina(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title>Notificaciones · FrutiMarket</title></head>
<body>
<section>
  <div class="titulo-pagina">
    <div><div class="migas"><a href="/">Inicio</a> / Notificaciones</div><h1>Notificaciones y recordatorios</h1>
      <p>Avisos de pedidos, pagos y planes, y los recordatorios que usted mismo programe.</p></div>
    <form method="post" th:action="@{/notificaciones/leer-todas}"><button class="btn btn-light"><i class="bi bi-check2-all me-1"></i>Marcar todas como leídas</button></form>
  </div>
  <div class="row g-3">
    <div class="col-lg-8">
      <div class="tarjeta">
        <div class="tarjeta-cab">
          <ul class="nav nav-pills small">
            <li class="nav-item"><a class="nav-link py-1" th:classappend="${ver == 'todas'} ? 'active'" href="/notificaciones">Recibidas</a></li>
            <li class="nav-item"><a class="nav-link py-1" th:classappend="${ver == 'pendientes'} ? 'active'" href="/notificaciones?ver=pendientes">Sin leer</a></li>
            <li class="nav-item"><a class="nav-link py-1" th:classappend="${ver == 'programadas'} ? 'active'" href="/notificaciones?ver=programadas">Programadas <span class="badge text-bg-light" th:text="${programadas}"></span></a></li>
          </ul>
        </div>
        <div th:each="n : ${lista}" class="notif" th:classappend="${!fmt.si(n.leida)} ? 'no-leida'">
          <div class="ico" th:switch="${n.tipo}">
            <span th:case="'PEDIDO'" class="ico ico-verde"><i class="bi bi-bag"></i></span>
            <span th:case="'PAGO'" class="ico ico-azul"><i class="bi bi-credit-card"></i></span>
            <span th:case="'SUSCRIPCION'" class="ico ico-mora"><i class="bi bi-box2-heart"></i></span>
            <span th:case="'INVENTARIO'" class="ico ico-naranja"><i class="bi bi-exclamation-triangle"></i></span>
            <span th:case="'RECORDATORIO'" class="ico ico-naranja"><i class="bi bi-alarm"></i></span>
            <span th:case="*" class="ico ico-verde"><i class="bi bi-info-circle"></i></span>
          </div>
          <div class="flex-grow-1">
            <div class="notif-tit fw-semibold" th:text="${n.titulo}"></div>
            <div class="small" th:text="${n.mensaje}"></div>
            <small class="text-secondary"><span th:text="${fmt.etiqueta(n.tipo)}"></span> · <span th:text="${fmt.fechaHora(n.fecha_programada)}"></span></small>
          </div>
          <div class="d-flex gap-1 align-items-start">
            <form th:if="${!fmt.si(n.leida)}" method="post" th:action="@{/notificaciones/{i}/leida(i=${n.id_notificacion}, ver=${ver})}"><button class="btn btn-sm btn-light" title="Marcar como leída"><i class="bi bi-check2"></i></button></form>
            <form method="post" th:action="@{/notificaciones/{i}/eliminar(i=${n.id_notificacion}, ver=${ver})}"><button class="btn btn-sm btn-light" title="Eliminar"><i class="bi bi-x-lg"></i></button></form>
          </div>
        </div>
        <div class="vacio" th:if="${lista.isEmpty()}"><i class="bi bi-bell-slash"></i>No hay notificaciones aquí.</div>
      </div>
    </div>
    <div class="col-lg-4">
      <form class="tarjeta" method="post" th:action="@{/notificaciones/recordatorio}">
        <div class="tarjeta-cab"><h2><i class="bi bi-alarm me-1 text-warning"></i>Nuevo recordatorio</h2></div>
        <div class="tarjeta-cuerpo">
          <div class="mb-3"><label class="form-label">¿Qué le recordamos?</label><input class="form-control" name="titulo" maxlength="100" required placeholder="Pedir fruta para el fin de semana"></div>
          <div class="mb-3"><label class="form-label">Detalle</label><textarea class="form-control" name="mensaje" rows="3" maxlength="400" placeholder="Mora, lulo y aguacate para el almuerzo del domingo"></textarea></div>
          <div class="mb-3"><label class="form-label">Cuándo</label><input class="form-control" name="cuando" type="datetime-local" required></div>
          <button class="btn btn-primary w-100">Programar recordatorio</button>
        </div>
      </form>
    </div>
  </div>
</section>
</body>
</html>
