<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title th:text="${r.titulo}">Reporte</title>
  <style th:replace="~{pdf/estilos :: css(${r.columnas.size() > 7})}"></style>
</head>
<body>
<table class="cab"><tr>
  <td style="width:38pt"><div class="logo">F</div></td>
  <td><div class="empresa">FrutiMarket Quindío</div><div class="gris peq">Sistema de información · Comercialización de frutas del Quindío</div></td>
  <td style="text-align:right" class="peq gris">Generado el <span th:text="${fmt.fechaHora(generado)}"></span><br/>por <span th:text="${generadoPor}"></span></td>
</tr></table>

<div class="peq gris">REPORTE <span th:text="${r.numero}"></span> DE 10</div>
<h1 th:text="${r.titulo}">Título</h1>
<div style="margin-bottom:6pt"><span class="nivel" th:classappend="'nivel-' + ${r.nivel.name()}" th:text="${#strings.toUpperCase(r.nivel.nombre)}"></span>
  <span class="peq gris" th:text="' ' + ${r.nivel.regla}"></span></div>
<div class="caja">
  <div th:text="${r.descripcion}"></div>
  <div class="peq" style="margin-top:3pt"><b>Para qué sirve: </b><span th:text="${r.decision}"></span></div>
  <div class="peq gris" style="margin-top:3pt" th:if="${!#strings.isEmpty(resumenFiltros)}"><b>Filtros: </b><span th:text="${resumenFiltros}"></span></div>
</div>

<div class="grafico" th:if="${imagenGrafico != null}">
  <h2 style="text-align:left" th:text="${r.grafico.titulo}">Gráfico</h2>
  <img th:src="${imagenGrafico}" alt="Gráfico"/>
</div>

<h2>Resultado (<span th:text="${filas.size()}"></span> filas)</h2>
<table class="datos">
  <thead><tr><th th:each="c : ${r.columnas}" th:class="${c.numerica()} ? 'num'" th:text="${c.etiqueta}">Col</th></tr></thead>
  <tbody>
    <tr th:each="f : ${filas}"><td th:each="c : ${r.columnas}" th:class="${c.numerica()} ? 'num'" th:text="${fmt.valor(f[c.clave], c.formato)}"></td></tr>
    <tr th:if="${filas.isEmpty()}"><td th:colspan="${r.columnas.size()}" style="text-align:center;padding:14pt" class="gris">Sin resultados con estos filtros.</td></tr>
    <tr class="total" th:if="${!totales.isEmpty() and !filas.isEmpty()}">
      <td th:each="c, st : ${r.columnas}" th:class="${c.numerica()} ? 'num'"
          th:text="${c.total} ? ${fmt.valor(totales[c.clave], c.formato)} : (${st.first} ? 'TOTAL' : '')"></td>
    </tr>
  </tbody>
</table>
<p class="peq gris" style="margin-top:10pt">Tablas consultadas: <span th:text="${#strings.listJoin(r.tablas, ', ')}"></span> · Técnicas SQL: <span th:text="${r.tecnicas}"></span></p>
</body>
</html>
