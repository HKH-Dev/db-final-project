<!DOCTYPE html>
<html th:replace="~{fragments/layout :: pagina(~{::title}, ~{::section})}" xmlns:th="http://www.thymeleaf.org">
<head><title>Pago en línea · FrutiMarket</title></head>
<body>
<section>
  <div class="mx-auto" style="max-width:620px">
    <a th:href="${volver}" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> Volver</a>
    <h1 class="h3 mt-2 mb-1">Pago en línea</h1>
    <p class="text-secondary">Pasarela de pagos simulada para el proyecto académico: no se cobra dinero real ni se piden datos de tarjeta.</p>
    <form class="tarjeta" method="post" th:action="${accion}">
      <div class="tarjeta-cuerpo border-bottom d-flex justify-content-between align-items-center">
        <div><div class="fw-bold" th:text="${concepto}"></div><small class="text-secondary" th:text="${detalle}"></small></div>
        <div class="fs-3 fw-bold" th:text="${fmt.moneda(valor)}"></div>
      </div>
      <div class="tarjeta-cuerpo">
        <div class="form-label mb-2">Medio de pago</div>
        <label th:each="m, st : ${metodos}" class="metodo-pago">
          <input type="radio" name="metodo" th:value="${m.id_metodo}" th:checked="${st.first}" required>
          <b th:text="${m.nombre}"></b>
          <small class="text-secondary ms-1" th:text="${fmt.si(m.en_linea)} ? '· Aprobación inmediata' : '· Se paga al recibir'"></small>
        </label>
        <div class="form-check mt-3">
          <input class="form-check-input" type="checkbox" name="rechazar" value="true" id="rechazar">
          <label class="form-check-label small" for="rechazar">Simular que el banco rechaza el pago (para probar el flujo)</label>
        </div>
      </div>
      <div class="tarjeta-cab" style="border-top:1px solid var(--fm-borde);border-bottom:0">
        <small class="text-secondary"><i class="bi bi-shield-lock"></i> Se registrará el pago, la factura y una notificación.</small>
        <button class="btn btn-naranja btn-lg">Pagar <span th:text="${fmt.moneda(valor)}"></span></button>
      </div>
    </form>
  </div>
</section>
</body>
</html>
